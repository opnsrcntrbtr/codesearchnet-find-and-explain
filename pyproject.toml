[project]
name = "csne"
version = "0.1.0"
description = "Semantic code search and summarization for Python code (CodeSearchNet)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "datasets>=2.19",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.41",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Summarization backends are optional so the retrieval path installs light.
anthropic = ["anthropic>=0.40"]
hf = ["accelerate>=0.30", "sentencepiece>=0.2"]
eval = ["evaluate>=0.4", "sacrebleu>=2.4", "bert-score>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
csne = "csne.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csne"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# TRY004 wants TypeError for shape mismatches, but a malformed config file is a
# bad value from the user's side, not a type bug in the caller.
ignore = ["TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads real models or hits the network; deselect with -m 'not slow'",
]
